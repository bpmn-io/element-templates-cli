name: CI
on: [ push, pull_request ]
jobs:
  Build:

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        envs:
        - node-version: 20
          integration-deps: 'mocha@11'
        - node-version: 24
          integration-deps: ''

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.envs.node-version }}
        cache: 'npm'
    - name: Install dependencies
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      run: npm ci
    - name: Install integration deps
      if: ${{ matrix.envs.integration-deps != '' }}
      run: npm install ${{ matrix.envs.integration-deps }}
    - name: Build
      run: npm run all
